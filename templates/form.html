<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan Approval Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Loan Approval Predictor</h1>
    <p class="subtitle">Fill in the applicant details to estimate approval.</p>
    <form action="/predict" method="post">
      <div class="grid">
        <label>Gender
          <select name="Gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </label>
        <label>Married
          <select name="Married">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </label>
        <label>Dependents
          <select name="Dependents">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3+">3+</option>
          </select>
        </label>
        <label>Education
          <select name="Education">
            <option value="Graduate">Graduate</option>
            <option value="Not Graduate">Not Graduate</option>
          </select>
        </label>
        <label>Self Employed
          <select name="Self_Employed">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </label>
        <label>Property Area
          <select name="Property_Area">
            <option value="Urban">Urban</option>
            <option value="Semiurban">Semiurban</option>
            <option value="Rural">Rural</option>
          </select>
        </label>
        <label>Applicant Income
          <input type="number" name="ApplicantIncome" required>
        </label>
        <label>Coapplicant Income
          <input type="number" name="CoapplicantIncome" value="0">
        </label>
        <label>Loan Amount (in thousands)
          <input type="number" name="LoanAmount" required>
        </label>
        <label>Loan Amount Term (months)
          <input type="number" name="Loan_Amount_Term" value="360">
        </label>
        <label>Credit History
          <select name="Credit_History">
            <option value="1">1 (good)</option>
            <option value="0">0 (bad)</option>
          </select>
        </label>
      </div>
      <button type="submit">Predict</button>
    </form>
  </div>
</body>
</html>
